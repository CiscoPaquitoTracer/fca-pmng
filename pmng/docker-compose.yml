services:
  pmng-back:
    image: backend:v1.0
    container_name: pmng-servicios
    build:
      context: ./service
    environment:
      DC_BACK_PORT: ${ENV_BACKEND_PORT}
      DC_DB_HOST: ${ENV_DB_HOST}
      DC_DB_PORT: ${ENV_DB_PORT}
      DC_DB_NAME: ${ENV_DB_NAME}
      DC_DB_USER: ${ENV_DB_USER}
      DC_DB_PASSWORD: ${ENV_DB_PASSWORD}
    ports:
      - "8089:8080"
    networks:
      - pmng-net

  pmng-front:
    image: frontend:v1.0
    container_name: pmng-cliente
    build: 
      context: ./client
    ports:
      - "5173:80"
    networks:
      - pmng-net

networks:
  pmng-net:
    external: true